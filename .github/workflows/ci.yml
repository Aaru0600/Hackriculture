name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_USE_MOCKS: "false"
          VITE_DIRECT_DATA_APIS: "false"

  backend:
    name: Backend (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  ml-service:
    name: ML service (train + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ml-service
      - name: Train models from the committed raw datasets
        working-directory: ml-service
        run: |
          python -m src.prepare_real_data && python -m src.train
          python -m src.prepare_crop_data && python -m src.train_crop
          python -m src.prepare_irrigation_data && python -m src.train_irrigation
      - run: python -m pytest -q
        working-directory: ml-service

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, backend, ml-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
