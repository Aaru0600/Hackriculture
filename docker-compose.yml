# HACKRICULTURE - full stack: Mongo + Python ML + Node API + React (nginx).
#
#   docker compose up --build
#
# Frontend:  http://localhost:8080
# API:       http://localhost:4000/api   (Swagger UI at /api/docs)
# ML:        http://localhost:8001
#
# The ml-service trains any missing models from ml-service/data/raw/*.csv on
# first start (see ml-service/docker-entrypoint.sh). Provide those CSVs or the
# yield endpoint falls back to the agronomic layer only.

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    volumes:
      - ./ml-service/data:/app/data
      - ./ml-service/models:/app/models
    ports:
      - "8001:8001"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
      - ml-service
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URI: mongodb://mongo:27017/hackriculture
      ML_SERVICE_URL: http://ml-service:8001
      CORS_ORIGIN: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SEED_DEMO_ADMIN: "true"
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCKS: "false"
        VITE_DIRECT_DATA_APIS: "false"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
